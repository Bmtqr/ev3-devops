name: Deploy to Amazon EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: devopseks

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, Tag, and Push Frontend to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -t tienda-frontend ./frontend
        docker tag tienda-frontend:latest $ECR_REGISTRY/tienda-frontend:eks-v1
        docker push $ECR_REGISTRY/tienda-frontend:eks-v1

    - name: Build, Tag, and Push Backend to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        docker build -t tienda-backend ./backend
        docker tag tienda-backend:latest $ECR_REGISTRY/tienda-backend:eks-v1
        docker push $ECR_REGISTRY/tienda-backend:eks-v1

    - name: Update Kubeconfig
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

    - name: Deploy to EKS
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Reemplazar la variable ECR_URL dinámicamente en los manifiestos antes de aplicar
        find ./k8s -type f -name "*.yaml" -exec sed -i "s|{{ECR_URL}}|$ECR_REGISTRY|g" {} \;
        
        # Despliegue secuencial de la arquitectura
        kubectl apply -f ./k8s/namespace.yaml
        kubectl apply -f ./k8s/mysql-secret.yaml
        kubectl apply -f ./k8s/mysql-deployment.yaml
        kubectl apply -f ./k8s/mysql-service.yaml
        kubectl apply -f ./k8s/backend-deployment.yaml
        kubectl apply -f ./k8s/backend-service.yaml
        kubectl apply -f ./k8s/frontend-deployment.yaml
        kubectl apply -f ./k8s/frontend-service.yaml
        
        # Despliegue de tus archivos HPA individuales
        kubectl apply -f ./k8s/frontend-hpa.yaml
        kubectl apply -f ./k8s/backend-hpa.yaml