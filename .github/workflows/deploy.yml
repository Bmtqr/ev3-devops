name: CI/CD Innovatech EKS

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Código
      uses: actions/checkout@v3

    - name: Configurar Credenciales AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: us-east-1

    - name: Login en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Compilar y Subir Imágenes a ECR
      run: |
        # Capturamos dinámicamente el endpoint autenticado por el paso anterior
        REGISTRY=${{ steps.login-ecr.outputs.registry }}
        
        # 1. Base de Datos
        docker build -t $REGISTRY/tienda-db:eks-v1 ./2_CloudShell/deploy-tienda-perritos/db
        docker push $REGISTRY/tienda-db:eks-v1
        
        # 2. Backend Node.js
        docker build -t $REGISTRY/tienda-backend:eks-v1 ./2_CloudShell/deploy-tienda-perritos/backend
        docker push $REGISTRY/tienda-backend:eks-v1
        
        # 3. Frontend Nginx
        docker build -t $REGISTRY/tienda-frontend:eks-v1 ./2_CloudShell/deploy-tienda-perritos/frontend
        docker push $REGISTRY/tienda-frontend:eks-v1

    - name: Actualizar Clúster EKS
      run: |
        aws eks update-kubeconfig --region us-east-1 --name devopseks
        
        # LÍNEA QUE FALTA: Capturar el registro e inyectarlo dinámicamente en el yaml de la BD
        REGISTRY=${{ steps.login-ecr.outputs.registry }}
        sed -i "s|{{ECR_URL}}|$REGISTRY|g" ./2_CloudShell/deploy-tienda-perritos/k8s/mysql-deployment.yaml
        sed -i "s|{{ECR_URL}}|$REGISTRY|g" ./2_CloudShell/deploy-tienda-perritos/k8s/backend-deployment.yaml
        sed -i "s|{{ECR_URL}}|$REGISTRY|g" ./2_CloudShell/deploy-tienda-perritos/k8s/frontend-deployment.yaml
        
        # 1. Aplicar espacio aislado de trabajo
        kubectl apply -f ./2_CloudShell/deploy-tienda-perritos/k8s/namespace.yaml
        
        # 2. Aplicar contraseñas y secrets de base de datos
        kubectl apply -f ./2_CloudShell/deploy-tienda-perritos/k8s/mysql-secret.yaml
        
        # 3. PRODUCIR LA PERSISTENCIA: Crear el volumen físico gp3 en AWS
        kubectl apply -f ./2_CloudShell/deploy-tienda-perritos/k8s/mysql-pvc.yaml
        
        # 4. Aplicar los servicios de red interna
        kubectl apply -f ./2_CloudShell/deploy-tienda-perritos/k8s/mysql-service.yaml
        kubectl apply -f ./2_CloudShell/deploy-tienda-perritos/k8s/backend-service.yaml
        kubectl apply -f ./2_CloudShell/deploy-tienda-perritos/k8s/frontend-service.yaml

        # 5. CREAR LOS DEPLOYMENTS EN EL CLÚSTER (Paso indispensable corregido)
        kubectl apply -f ./2_CloudShell/deploy-tienda-perritos/k8s/mysql-deployment.yaml
        kubectl apply -f ./2_CloudShell/deploy-tienda-perritos/k8s/backend-deployment.yaml
        kubectl apply -f ./2_CloudShell/deploy-tienda-perritos/k8s/frontend-deployment.yaml
        
        # 6. AUTOMATIZAR EL ESCALADO: Registrar los recursos HPA en el clúster
        kubectl apply -f ./2_CloudShell/deploy-tienda-perritos/k8s/backend-hpa.yaml
        kubectl apply -f ./2_CloudShell/deploy-tienda-perritos/k8s/frontend-hpa.yaml
        
        # 7. Forzar el reinicio ordenado de los deployments en el clúster orquestado
        kubectl rollout restart deployment/tienda-db -n tienda
        kubectl rollout restart deployment/tienda-backend -n tienda
        kubectl rollout restart deployment/tienda-frontend -n tienda